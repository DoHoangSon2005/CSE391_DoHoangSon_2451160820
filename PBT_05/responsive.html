<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Product Page</title>

    <link rel="stylesheet" href="responsive.css">
</head>
<body>

    <header>
        <h1>ShopTLU</h1>

        <div class="hamburger">
            ☰
        </div>

        <nav class="nav-menu">
            <a href="#">Trang chủ</a>
            <a href="#">Sản phẩm</a>
            <a href="#">Liên hệ</a>
        </nav>
    </header>

    <div class="layout">

        <aside class="sidebar">
            <h2>Bộ lọc</h2>

            <select>
                <option>Điện thoại</option>
                <option>Laptop</option>
                <option>Tablet</option>
            </select>
        </aside>

        <main class="products">

            <div class="card">
                <img src="https://placehold.co/200x150" alt="Sản phẩm">
                <h3>iPhone 16</h3>
                <p>25.990.000đ</p>
            </div>

            <div class="card">
                <img src="https://placehold.co/200x150" alt="Sản phẩm">
                <h3>Samsung S25</h3>
                <p>22.990.000đ</p>
            </div>

            <div class="card">
                <img src="https://placehold.co/200x150" alt="Sản phẩm">
                <h3>MacBook Pro</h3>
                <p>45.990.000đ</p>
            </div>

            <div class="card">
                <img src="https://placehold.co/200x150" alt="Sản phẩm">
                <h3>iPad Air</h3>
                <p>18.990.000đ</p>
            </div>

            <div class="card">
                <img src="https://placehold.co/200x150" alt="Sản phẩm">
                <h3>Xiaomi 15</h3>
                <p>15.990.000đ</p>
            </div>

            <div class="card">
                <img src="https://placehold.co/200x150" alt="Sản phẩm">
                <h3>Asus ROG</h3>
                <p>39.990.000đ</p>
            </div>

            <div class="card">
                <img src="https://placehold.co/200x150" alt="Sản phẩm">
                <h3>Apple Watch</h3>
                <p>12.990.000đ</p>
            </div>

            <div class="card">
                <img src="https://placehold.co/200x150" alt="Sản phẩm">
                <h3>AirPods Pro</h3>
                <p>5.990.000đ</p>
            </div>

        </main>

        <aside class="ads">
            <h2>Quảng cáo</h2>
            <p>Sale 50%</p>
        </aside>

    </div>

    <footer>
        <p>© 2026 ShopTLU</p>
    </footer>

</body>
</html>
